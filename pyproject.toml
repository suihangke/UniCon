[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unicon"
version = "0.1.0"
description = "UniCon: Unified Framework for Efficient Contrastive Alignment via Kernels (NeurIPS 2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
features = ["torchvision", "transformers", "sentence-transformers", "datasets", "pillow"]
[tool.setuptools.packages.find]
include = ["unicon*"]
